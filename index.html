<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Important Question 👀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffeef5, #ffd6e5);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: white;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
    }

    h1 {
      font-size: 28px;
      margin: 0 0 30px;
      color: #333;
    }

    button {
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      margin: 8px;
      transition: transform 0.15s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    #yes {
      background: #ff4f81;
      color: white;
    }

    #no {
      background: #ddd;
      color: #333;
      position: relative;
    }

    #result {
      display: none;
    }

    .good {
      font-size: 30px;
      font-weight: bold;
      color: #ff4081;
      margin-bottom: 10px;
    }

    .message {
      font-size: 18px;
      color: #555;
      margin-bottom: 15px;
    }

    #result img {
      display: block;
      width: 100%;
      max-width: 320px;
      max-height: 400px;
      object-fit: contain;
      margin: 15px auto 0;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <!-- QUESTION -->
  <div class="box" id="question">

    <h1>Are you himmar? 🫏</h1>

    <button id="yes" onclick="yesClicked()">
      Yes 😇
    </button>

    <button id="no" onclick="moveNo()">
      No 😎
    </button>

  </div>


  <!-- RESULT -->
  <div class="box" id="result">

    <div class="good">
      Good girl 😏
    </div>

    <div class="message">
      I knew it 😂
    </div>

    <!-- GitHub image -->
    <img
      src="https://raw.githubusercontent.com/nitroblade22/Prank/main/IMG_2216.webp"
      alt="Prank image"
    >

  </div>


  <script>

    // Make the NO button run away
    function moveNo() {

      const button = document.getElementById("no");

      const maxX =
        window.innerWidth - button.offsetWidth - 20;

      const maxY =
        window.innerHeight - button.offsetHeight - 20;

      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(10, Math.random() * maxY);

      button.style.position = "fixed";
      button.style.left = x + "px";
      button.style.top = y + "px";
    }


    // YES button
    function yesClicked() {

      document.getElementById("question").style.display = "none";

      document.getElementById("result").style.display = "block";

    }

  </script>

</body>
</html>
