<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Important Question 👀</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffeef5;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .box {
      text-align: center;
      background: white;
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 80%;
      max-width: 400px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      margin: 8px;
    }

    #yes {
      background: #ff4f81;
      color: white;
    }

    #no {
      background: #ddd;
      color: #333;
      position: relative;
    }

    #result {
      display: none;
    }

    #result img {
      width: 100%;
      max-width: 300px;
      border-radius: 15px;
      margin-top: 15px;
    }

    .good {
      font-size: 30px;
      font-weight: bold;
      color: #ff4081;
    }
  </style>
</head>

<body>

  <div class="box" id="question">
    <h1>Are you himmar? 🫏</h1>

    <button id="yes" onclick="yesClicked()">Yes 😇</button>
    <button id="no" onclick="moveNo()">No 😎</button>
  </div>

  <div class="box" id="result">
    <div class="good">Good girl 😏</div>

    <img src="IMG_2216.webp" alt="Monkey">
  </div>

  <script>
    function moveNo() {
      const button = document.getElementById("no");

      const maxX = window.innerWidth - button.offsetWidth - 20;
      const maxY = window.innerHeight - button.offsetHeight - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      button.style.position = "fixed";
      button.style.left = x + "px";
      button.style.top = y + "px";
    }

    function yesClicked() {
      document.getElementById("question").style.display = "none";
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
